<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Returning to Flip for Free…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f0; color: #1d2320;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #121513; color: #e8ebe8; } a { color: #3fbf7f; } }
  main { text-align: center; padding: 24px; }
  a { color: #146c43; }
</style>
</head>
<body>
<main>
  <p id="msg">Returning to Flip for Free…</p>
  <p><a id="link" href="#" hidden>Click here if nothing happens</a></p>
</main>
<script>
  // eBay sends you here after sign-in. This page runs only in your own browser:
  // it forwards the one-time sign-in code straight to the app on your computer.
  (function () {
    var q = location.search || "";
    var params = new URLSearchParams(q);
    var state = params.get("state") || "";
    var port = (state.match(/^(\d{2,5})\./) || [])[1] || "8765";
    var target = "https://localhost:" + port + "/auth/callback" + q;
    var link = document.getElementById("link");
    link.href = target;
    link.hidden = false;
    location.replace(target);
  })();
</script>
</body>
</html>
