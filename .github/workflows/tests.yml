name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (errors and unused code)
        run: ruff check --select F,E9 *.py tools/*.py tests/*.py
      - name: Tests (demo data, no eBay account needed)
        run: python -m pytest -q tests
